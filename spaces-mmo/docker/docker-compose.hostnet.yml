# Override for the `big` host (docker compose -f docker-compose.yml -f docker-compose.hostnet.yml --profile big ...): the
# roles share the host network, so they reach the nano spaces through SSH tunnels on the host's loopback
# (SPACES_MMO_SPACE=tcp:127.0.0.1:3950 and SPACES_MMO_ACCOUNTS=tcp:127.0.0.1:3951 in .env, user units on big as for the
# help system and the chat). The web process listens on the loopback only, for the reverse proxy in front.
services:
  web:
    network_mode: host
    networks: !reset []
    ports: !reset []
    environment:
      SPACES_MMO_SPACE: "${SPACES_MMO_SPACE:-tcp:127.0.0.1:3950}"
      SPACES_MMO_ACCOUNTS: "${SPACES_MMO_ACCOUNTS:-tcp:127.0.0.1:3951}"
      SPACES_MMO_BIND: 127.0.0.1
  world-big:
    network_mode: host
    networks: !reset []
    environment:
      SPACES_MMO_SPACE: "${SPACES_MMO_SPACE:-tcp:127.0.0.1:3950}"
  npc:
    network_mode: host
    networks: !reset []
    environment:
      SPACES_MMO_SPACE: "${SPACES_MMO_SPACE:-tcp:127.0.0.1:3950}"
  model:
    network_mode: host
    networks: !reset []
    environment:
      SPACES_MMO_SPACE: "${SPACES_MMO_SPACE:-tcp:127.0.0.1:3950}"
