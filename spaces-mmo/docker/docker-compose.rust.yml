# The Rust space server in the space containers, for a test bed on this machine (docs/rust-portierung.en.md, R4):
# `npm run docker:rust:up` after `npm run docker:image:rust`, as a project of its own with volumes of its own. On the
# machines `docker:nano:rust:up` and `docker:big:rust:up` lay it over their profile (same project, same volumes);
# docker:nano:up and docker:big:up refuse since 2026-11-12 (R-D12: the servers run only the Rust implementation).
services:
  space:
    build:
      target: production-rust
    image: phi-spaces-mmo:rust
    command: ["/usr/local/bin/phi-space-server", "--profile", "mmo"]

  space-west:
    build:
      target: production-rust
    image: phi-spaces-mmo:rust
    command: ["/usr/local/bin/phi-space-server", "--profile", "mmo"]

  space-nord:
    build:
      target: production-rust
    image: phi-spaces-mmo:rust
    command: ["/usr/local/bin/phi-space-server", "--profile", "mmo"]

  space-ost:
    build:
      target: production-rust
    image: phi-spaces-mmo:rust
    command: ["/usr/local/bin/phi-space-server", "--profile", "mmo"]

  space-sued:
    build:
      target: production-rust
    image: phi-spaces-mmo:rust
    command: ["/usr/local/bin/phi-space-server", "--profile", "mmo"]
