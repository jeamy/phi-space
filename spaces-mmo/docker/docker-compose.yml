# Docker Compose for spaces-mmo: one container per role, all from the one `production` image, talking only through the
# space over TCP (docs/architektur.md), laid out like codemode-chat/docker/docker-compose.yml.
#
#   profile nano:  the accounts space (credentials, web sessions) in a volume — on nano
#   profile big:   the world in its regions (server/engine/regions.ts, docs/welt-aufteilen.md): per region a space process
#                  (world-<region>.sqlite), a world worker, an npc and a model process, each region's space on a core of
#                  its own; and the web process — on big. npc and model are the only roles with model credentials
#                  (the host's pi CLI login)
#   both at once:  the pair on one machine (local test bed, docker:local:up)
#   profile dev:   all roles in one container with the checkout mounted, recompiled and restarted on every change
#   profile test:  the test suite
#
# On two real hosts, big reaches nano's accounts space at SPACES_MMO_ACCOUNTS=tcp:127.0.0.1:3951 (its .env; an SSH tunnel
# on big's loopback, docker-compose.hostnet.yml), and nano publishes it on SPACES_MMO_SPACE_BIND (its internal address). The space sockets
# have no TLS and treat every connection as a process of the game (the accounts space holds the credentials): never publish
# them on a public interface.
# Ports: 3900 (web), 3950/3952/3953/3954 (the spaces of west, nord, ost, sued), 3951 (accounts space) — codemode-chat uses 3700/3800, the help system 3500/3600.

name: phi-spaces-mmo

x-role: &role
  # every role container is built from the same image (built once, the others reuse it)
  build:
    context: ../..
    dockerfile: spaces-mmo/docker/Dockerfile
    target: production
  image: phi-spaces-mmo:prod
  init: true
  restart: unless-stopped
  user: "node"
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp
  env_file:
    - path: ../.env
      required: false
  networks:
    - mmo

x-big: &big
  <<: *role
  depends_on:
    space:
      condition: service_healthy
      required: false

services:
  # ---- nano: the accounts space ----
  space:
    <<: *role
    profiles: [nano]
    command: ["node", "--no-warnings", "--experimental-strip-types", "server/space-host.ts"]
    environment:
      NODE_ENV: production
      SPACES_MMO_LISTEN: tcp:0.0.0.0:3950
      SPACES_MMO_ACCOUNTS_LISTEN: tcp:0.0.0.0:3951
      SPACES_MMO_DATA: /data
      SPACES_MMO_HOST_NAME: "${NANO_HOST_NAME:-nano}"
      # the accounts only: the world lives in the region spaces (profile big)
      SPACES_MMO_SPACES: accounts
    cpus: "${NANO_CPUS:-0}"
    ports:
      # loopback by default; on the nano host set SPACES_MMO_SPACE_BIND to its internal address for big
      - "${SPACES_MMO_SPACE_BIND:-127.0.0.1}:${SPACES_MMO_ACCOUNTS_PORT:-3951}:3951"
    volumes:
      - mmo-space-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('net').connect(3951,'127.0.0.1');s.once('connect',()=>{s.end();process.exit(0)});s.once('error',()=>process.exit(1));setTimeout(()=>process.exit(1),4000)"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3

  # ---- big: web and the regions ----
  web:
    <<: *big
    profiles: [big]
    command: ["node", "--no-warnings", "--experimental-strip-types", "server/index.ts"]
    environment:
      NODE_ENV: production
      SPACES_MMO_SPACE: "${SPACES_MMO_SPACE:-tcp:space-west:3950}"
      SPACES_MMO_ACCOUNTS: "${SPACES_MMO_ACCOUNTS:-tcp:space:3951}"
      # every region's space as the web process reaches it (big: the loopback ports, .env)
      SPACES_MMO_REGIONS: "${SPACES_MMO_WEB_REGIONS:-west=tcp:space-west:3950,nord=tcp:space-nord:3950,ost=tcp:space-ost:3950,sued=tcp:space-sued:3950}"
      SPACES_MMO_HOST_NAME: "${BIG_HOST_NAME:-big}"
      SPACES_MMO_BIND: 0.0.0.0
      PORT: "3900"
      # where the browser reaches it (the published port; the log line names it)
      SPACES_MMO_PUBLIC_URL: "http://${HOST_BIND:-127.0.0.1}:${PORT:-3900}"
    ports:
      # loopback by default, for the reverse proxy in front
      - "${HOST_BIND:-127.0.0.1}:${PORT:-3900}:3900"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3900/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

  # ---- per region a space, a world worker, a model and an npc process ----
  space-west:
    <<: *role
    profiles: [big]
    command: ["node", "--no-warnings", "--experimental-strip-types", "server/space-host.ts"]
    environment:
      NODE_ENV: production
      SPACES_MMO_SPACES: world
      SPACES_MMO_REGION: west
      SPACES_MMO_LISTEN: tcp:0.0.0.0:3950
      SPACES_MMO_DATA: /data
      SPACES_MMO_HOST_NAME: "${BIG_HOST_NAME:-big}"
    ports:
      # loopback: the web and model processes (host network) reach it here
      - "127.0.0.1:${SPACES_MMO_WEST_PORT:-3950}:3950"
    volumes:
      - mmo-space-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('net').connect(3950,'127.0.0.1');s.once('connect',()=>{s.end();process.exit(0)});s.once('error',()=>process.exit(1));setTimeout(()=>process.exit(1),4000)"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3

  world-west:
    <<: *role
    profiles: [big]
    command: ["node", "--no-warnings", "--experimental-strip-types", "server/world-host.ts"]
    environment:
      NODE_ENV: production
      SPACES_MMO_SPACE: tcp:space-west:3950
      SPACES_MMO_REGION: west
      SPACES_MMO_REGIONS: "west=tcp:space-west:3950,nord=tcp:space-nord:3950,ost=tcp:space-ost:3950,sued=tcp:space-sued:3950"
      SPACES_MMO_HOST_NAME: "${BIG_HOST_NAME:-big}"
    depends_on:
      space-west:
        condition: service_healthy

  # a region's translations (its world worker asks in its own space; the counts are per region)
  model-west:
    <<: *role
    profiles: [big]
    command: ["node", "--no-warnings", "--experimental-strip-types", "server/model-host.ts"]
    environment:
      NODE_ENV: production
      SPACES_MMO_SPACE: tcp:space-west:3950
      SPACES_MMO_HOST_NAME: "${BIG_HOST_NAME:-big}"
    depends_on:
      space-west:
        condition: service_healthy
    volumes:
      - "${PI_AUTH_DIR:-${HOME}/.pi/agent}:/home/node/.pi/agent:ro"

  npc-west:
    <<: *role
    profiles: [big]
    command: ["node", "--no-warnings", "--experimental-strip-types", "server/npc-host.ts"]
    environment:
      NODE_ENV: production
      SPACES_MMO_SPACE: tcp:space-west:3950
      SPACES_MMO_REGION: west
      SPACES_MMO_REGIONS: "west=tcp:space-west:3950,nord=tcp:space-nord:3950,ost=tcp:space-ost:3950,sued=tcp:space-sued:3950"
      SPACES_MMO_HOST_NAME: "${BIG_HOST_NAME:-big}"
    depends_on:
      space-west:
        condition: service_healthy
    volumes:
      - "${PI_AUTH_DIR:-${HOME}/.pi/agent}:/home/node/.pi/agent:ro"

  space-nord:
    <<: *role
    profiles: [big]
    command: ["node", "--no-warnings", "--experimental-strip-types", "server/space-host.ts"]
    environment:
      NODE_ENV: production
      SPACES_MMO_SPACES: world
      SPACES_MMO_REGION: nord
      SPACES_MMO_LISTEN: tcp:0.0.0.0:3950
      SPACES_MMO_DATA: /data
      SPACES_MMO_HOST_NAME: "${BIG_HOST_NAME:-big}"
    ports:
      # loopback: the web and model processes (host network) reach it here
      - "127.0.0.1:${SPACES_MMO_NORD_PORT:-3952}:3950"
    volumes:
      - mmo-space-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('net').connect(3950,'127.0.0.1');s.once('connect',()=>{s.end();process.exit(0)});s.once('error',()=>process.exit(1));setTimeout(()=>process.exit(1),4000)"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3

  world-nord:
    <<: *role
    profiles: [big]
    command: ["node", "--no-warnings", "--experimental-strip-types", "server/world-host.ts"]
    environment:
      NODE_ENV: production
      SPACES_MMO_SPACE: tcp:space-nord:3950
      SPACES_MMO_REGION: nord
      SPACES_MMO_REGIONS: "west=tcp:space-west:3950,nord=tcp:space-nord:3950,ost=tcp:space-ost:3950,sued=tcp:space-sued:3950"
      SPACES_MMO_HOST_NAME: "${BIG_HOST_NAME:-big}"
    depends_on:
      space-nord:
        condition: service_healthy

  # a region's translations (its world worker asks in its own space; the counts are per region)
  model-nord:
    <<: *role
    profiles: [big]
    command: ["node", "--no-warnings", "--experimental-strip-types", "server/model-host.ts"]
    environment:
      NODE_ENV: production
      SPACES_MMO_SPACE: tcp:space-nord:3950
      SPACES_MMO_HOST_NAME: "${BIG_HOST_NAME:-big}"
    depends_on:
      space-nord:
        condition: service_healthy
    volumes:
      - "${PI_AUTH_DIR:-${HOME}/.pi/agent}:/home/node/.pi/agent:ro"

  npc-nord:
    <<: *role
    profiles: [big]
    command: ["node", "--no-warnings", "--experimental-strip-types", "server/npc-host.ts"]
    environment:
      NODE_ENV: production
      SPACES_MMO_SPACE: tcp:space-nord:3950
      SPACES_MMO_REGION: nord
      SPACES_MMO_REGIONS: "west=tcp:space-west:3950,nord=tcp:space-nord:3950,ost=tcp:space-ost:3950,sued=tcp:space-sued:3950"
      SPACES_MMO_HOST_NAME: "${BIG_HOST_NAME:-big}"
    depends_on:
      space-nord:
        condition: service_healthy
    volumes:
      - "${PI_AUTH_DIR:-${HOME}/.pi/agent}:/home/node/.pi/agent:ro"

  space-ost:
    <<: *role
    profiles: [big]
    command: ["node", "--no-warnings", "--experimental-strip-types", "server/space-host.ts"]
    environment:
      NODE_ENV: production
      SPACES_MMO_SPACES: world
      SPACES_MMO_REGION: ost
      SPACES_MMO_LISTEN: tcp:0.0.0.0:3950
      SPACES_MMO_DATA: /data
      SPACES_MMO_HOST_NAME: "${BIG_HOST_NAME:-big}"
    ports:
      # loopback: the web and model processes (host network) reach it here
      - "127.0.0.1:${SPACES_MMO_OST_PORT:-3953}:3950"
    volumes:
      - mmo-space-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('net').connect(3950,'127.0.0.1');s.once('connect',()=>{s.end();process.exit(0)});s.once('error',()=>process.exit(1));setTimeout(()=>process.exit(1),4000)"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3

  world-ost:
    <<: *role
    profiles: [big]
    command: ["node", "--no-warnings", "--experimental-strip-types", "server/world-host.ts"]
    environment:
      NODE_ENV: production
      SPACES_MMO_SPACE: tcp:space-ost:3950
      SPACES_MMO_REGION: ost
      SPACES_MMO_REGIONS: "west=tcp:space-west:3950,nord=tcp:space-nord:3950,ost=tcp:space-ost:3950,sued=tcp:space-sued:3950"
      SPACES_MMO_HOST_NAME: "${BIG_HOST_NAME:-big}"
    depends_on:
      space-ost:
        condition: service_healthy

  # a region's translations (its world worker asks in its own space; the counts are per region)
  model-ost:
    <<: *role
    profiles: [big]
    command: ["node", "--no-warnings", "--experimental-strip-types", "server/model-host.ts"]
    environment:
      NODE_ENV: production
      SPACES_MMO_SPACE: tcp:space-ost:3950
      SPACES_MMO_HOST_NAME: "${BIG_HOST_NAME:-big}"
    depends_on:
      space-ost:
        condition: service_healthy
    volumes:
      - "${PI_AUTH_DIR:-${HOME}/.pi/agent}:/home/node/.pi/agent:ro"

  npc-ost:
    <<: *role
    profiles: [big]
    command: ["node", "--no-warnings", "--experimental-strip-types", "server/npc-host.ts"]
    environment:
      NODE_ENV: production
      SPACES_MMO_SPACE: tcp:space-ost:3950
      SPACES_MMO_REGION: ost
      SPACES_MMO_REGIONS: "west=tcp:space-west:3950,nord=tcp:space-nord:3950,ost=tcp:space-ost:3950,sued=tcp:space-sued:3950"
      SPACES_MMO_HOST_NAME: "${BIG_HOST_NAME:-big}"
    depends_on:
      space-ost:
        condition: service_healthy
    volumes:
      - "${PI_AUTH_DIR:-${HOME}/.pi/agent}:/home/node/.pi/agent:ro"

  space-sued:
    <<: *role
    profiles: [big]
    command: ["node", "--no-warnings", "--experimental-strip-types", "server/space-host.ts"]
    environment:
      NODE_ENV: production
      SPACES_MMO_SPACES: world
      SPACES_MMO_REGION: sued
      SPACES_MMO_LISTEN: tcp:0.0.0.0:3950
      SPACES_MMO_DATA: /data
      SPACES_MMO_HOST_NAME: "${BIG_HOST_NAME:-big}"
    ports:
      # loopback: the web and model processes (host network) reach it here
      - "127.0.0.1:${SPACES_MMO_SUED_PORT:-3954}:3950"
    volumes:
      - mmo-space-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('net').connect(3950,'127.0.0.1');s.once('connect',()=>{s.end();process.exit(0)});s.once('error',()=>process.exit(1));setTimeout(()=>process.exit(1),4000)"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3

  world-sued:
    <<: *role
    profiles: [big]
    command: ["node", "--no-warnings", "--experimental-strip-types", "server/world-host.ts"]
    environment:
      NODE_ENV: production
      SPACES_MMO_SPACE: tcp:space-sued:3950
      SPACES_MMO_REGION: sued
      SPACES_MMO_REGIONS: "west=tcp:space-west:3950,nord=tcp:space-nord:3950,ost=tcp:space-ost:3950,sued=tcp:space-sued:3950"
      SPACES_MMO_HOST_NAME: "${BIG_HOST_NAME:-big}"
    depends_on:
      space-sued:
        condition: service_healthy

  # a region's translations (its world worker asks in its own space; the counts are per region)
  model-sued:
    <<: *role
    profiles: [big]
    command: ["node", "--no-warnings", "--experimental-strip-types", "server/model-host.ts"]
    environment:
      NODE_ENV: production
      SPACES_MMO_SPACE: tcp:space-sued:3950
      SPACES_MMO_HOST_NAME: "${BIG_HOST_NAME:-big}"
    depends_on:
      space-sued:
        condition: service_healthy
    volumes:
      - "${PI_AUTH_DIR:-${HOME}/.pi/agent}:/home/node/.pi/agent:ro"

  npc-sued:
    <<: *role
    profiles: [big]
    command: ["node", "--no-warnings", "--experimental-strip-types", "server/npc-host.ts"]
    environment:
      NODE_ENV: production
      SPACES_MMO_SPACE: tcp:space-sued:3950
      SPACES_MMO_REGION: sued
      SPACES_MMO_REGIONS: "west=tcp:space-west:3950,nord=tcp:space-nord:3950,ost=tcp:space-ost:3950,sued=tcp:space-sued:3950"
      SPACES_MMO_HOST_NAME: "${BIG_HOST_NAME:-big}"
    depends_on:
      space-sued:
        condition: service_healthy
    volumes:
      - "${PI_AUTH_DIR:-${HOME}/.pi/agent}:/home/node/.pi/agent:ro"

  # ---- tests in Docker ----
  mmo-test:
    build:
      context: ../..
      dockerfile: spaces-mmo/docker/Dockerfile
      target: dev-test
    image: phi-spaces-mmo:dev-test
    profiles: [test]
    init: true
    user: "node"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    environment:
      NODE_ENV: test
    command: ["npm", "--prefix", "spaces-mmo", "test"]

  # ---- development: every role in one container, the checkout mounted ----
  mmo-dev:
    build:
      context: ../..
      dockerfile: spaces-mmo/docker/Dockerfile
      target: dev-test
    image: phi-spaces-mmo:dev-test
    profiles: [dev]
    init: true
    user: "node"
    env_file:
      - path: ../.env
        required: false
    environment:
      NODE_ENV: development
      SPACES_MMO_BIND: 0.0.0.0
      SPACES_MMO_HOST_NAME: "${SPACES_MMO_HOST_NAME:-dev}"
      PORT: "3900"
      SPACES_MMO_PUBLIC_URL: "http://127.0.0.1:${SPACES_MMO_DEV_PORT:-3920}"
      SPACES_MMO_DATA: /data
      # the page may be opened as localhost too (Next's dev server serves its scripts only to known origins)
      SPACES_MMO_DEV_ORIGINS: "localhost"
      # a developer opens many guests an hour (the default allows five per address)
      SPACES_MMO_GUESTS_PER_HOUR: "200"
      # which NPC roles play in the dev container (empty: all of them); SPACES_MMO_DEV_NPCS=ines,bo lightens the load
      SPACES_MMO_NPCS: "${SPACES_MMO_DEV_NPCS:-}"
      # model calls (they cost tokens): off unless started with SPACES_MMO_LLM=1 in the shell or .env
      SPACES_MMO_LLM: "${SPACES_MMO_LLM:-0}"
    ports:
      # loopback only; 3920 so a game on 3900 or the local test bed on 3910 keeps running next to it
      - "127.0.0.1:${SPACES_MMO_DEV_PORT:-3920}:3900"
    volumes:
      - mmo-dev-data:/data
      # the host's pi CLI login, read-only, for model NPCs and translations in dev (PI_AUTH_DIR= skips it)
      - "${PI_AUTH_DIR:-${HOME}/.pi/agent}:/home/node/.pi/agent:ro"
      - ../app:/opt/phi-spaces/spaces-mmo/app
      - ../client:/opt/phi-spaces/spaces-mmo/client
      - ../server:/opt/phi-spaces/spaces-mmo/server
      - ../worlds:/opt/phi-spaces/spaces-mmo/worlds
      - ../../src:/opt/phi-spaces/src
    working_dir: /opt/phi-spaces/spaces-mmo
    # space, world, npc and web (Next.js dev mode) as processes of their own: Next.js recompiles app/ and client/ on change
    # (Fast Refresh), and each process restarts when server/, worlds/ or the phi-spaces sources change
    command: ["node", "--no-warnings", "--experimental-strip-types", "server/launch.ts", "--dev"]

networks:
  mmo: {}

volumes:
  mmo-space-data: {}
  mmo-dev-data: {}
