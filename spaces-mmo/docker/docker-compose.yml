# Docker Compose for spaces-mmo: one container per role, all from the one `production` image, talking only through the
# space over TCP (docs/architektur.md), laid out like codemode-chat/docker/docker-compose.yml.
#
#   profile nano:  space (the world and accounts stores in a volume) and a world worker — the host that keeps the state
#   profile big:   web, a world worker and the npc process — the host that does most of the work
#   both at once:  the big/nano pair on one machine (local test bed): the same TCP connections as between two hosts,
#                  NANO_CPUS caps nano's CPUs like the smaller machine
#   profile dev:   all roles in one container with the checkout mounted, recompiled and restarted on every change
#   profile test:  the test suite
#
# On two real hosts, big reaches nano's spaces at SPACES_MMO_SPACE=tcp:<nano's internal address>:3950 and
# SPACES_MMO_ACCOUNTS=tcp:<nano's internal address>:3951 (its .env; docker-compose.hostnet.yml: through SSH tunnels on
# big's loopback), and nano publishes both on SPACES_MMO_SPACE_BIND (its internal LAN/NetBird address). The space sockets
# have no TLS and treat every connection as a process of the game (the accounts space holds the credentials): never publish
# them on a public interface.
# Ports: 3900 (web), 3950 (world space), 3951 (accounts space) — codemode-chat uses 3700/3800, the help system 3500/3600.

name: phi-spaces-mmo

x-role: &role
  # every role container is built from the same image (built once, the others reuse it)
  build:
    context: ../..
    dockerfile: spaces-mmo/docker/Dockerfile
    target: production
  image: phi-spaces-mmo:prod
  init: true
  restart: unless-stopped
  user: "node"
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp
  env_file:
    - path: ../.env
      required: false
  networks:
    - mmo

x-big: &big
  <<: *role
  depends_on:
    space:
      condition: service_healthy
      required: false

services:
  # ---- nano: the spaces and a world worker ----
  space:
    <<: *role
    profiles: [nano]
    command: ["node", "--no-warnings", "--experimental-strip-types", "server/space-host.ts"]
    environment:
      NODE_ENV: production
      SPACES_MMO_LISTEN: tcp:0.0.0.0:3950
      SPACES_MMO_ACCOUNTS_LISTEN: tcp:0.0.0.0:3951
      SPACES_MMO_DATA: /data
    cpus: "${NANO_CPUS:-0}"
    ports:
      # loopback by default; on the nano host set SPACES_MMO_SPACE_BIND to its internal address for big
      - "${SPACES_MMO_SPACE_BIND:-127.0.0.1}:${SPACES_MMO_WORLD_PORT:-3950}:3950"
      - "${SPACES_MMO_SPACE_BIND:-127.0.0.1}:${SPACES_MMO_ACCOUNTS_PORT:-3951}:3951"
    volumes:
      - mmo-space-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('net').connect(3950,'127.0.0.1');s.once('connect',()=>{s.end();process.exit(0)});s.once('error',()=>process.exit(1));setTimeout(()=>process.exit(1),4000)"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3

  world-nano:
    <<: *role
    profiles: [nano]
    command: ["node", "--no-warnings", "--experimental-strip-types", "server/world-host.ts"]
    environment:
      NODE_ENV: production
      SPACES_MMO_SPACE: tcp:space:3950
    cpus: "${NANO_CPUS:-0}"
    depends_on:
      space:
        condition: service_healthy

  # ---- big: web, a world worker, the npc process ----
  web:
    <<: *big
    profiles: [big]
    command: ["node", "--no-warnings", "--experimental-strip-types", "server/index.ts"]
    environment:
      NODE_ENV: production
      SPACES_MMO_SPACE: "${SPACES_MMO_SPACE:-tcp:space:3950}"
      SPACES_MMO_ACCOUNTS: "${SPACES_MMO_ACCOUNTS:-tcp:space:3951}"
      SPACES_MMO_BIND: 0.0.0.0
      PORT: "3900"
    ports:
      # loopback by default, for the reverse proxy in front
      - "${HOST_BIND:-127.0.0.1}:${PORT:-3900}:3900"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3900/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

  world-big:
    <<: *big
    profiles: [big]
    command: ["node", "--no-warnings", "--experimental-strip-types", "server/world-host.ts"]
    environment:
      NODE_ENV: production
      SPACES_MMO_SPACE: "${SPACES_MMO_SPACE:-tcp:space:3950}"

  npc:
    <<: *big
    profiles: [big]
    command: ["node", "--no-warnings", "--experimental-strip-types", "server/npc-host.ts"]
    environment:
      NODE_ENV: production
      SPACES_MMO_SPACE: "${SPACES_MMO_SPACE:-tcp:space:3950}"

  # ---- tests in Docker ----
  mmo-test:
    build:
      context: ../..
      dockerfile: spaces-mmo/docker/Dockerfile
      target: dev-test
    image: phi-spaces-mmo:dev-test
    profiles: [test]
    init: true
    user: "node"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    environment:
      NODE_ENV: test
    command: ["npm", "--prefix", "spaces-mmo", "test"]

  # ---- development: every role in one container, the checkout mounted ----
  mmo-dev:
    build:
      context: ../..
      dockerfile: spaces-mmo/docker/Dockerfile
      target: dev-test
    image: phi-spaces-mmo:dev-test
    profiles: [dev]
    init: true
    user: "node"
    env_file:
      - path: ../.env
        required: false
    environment:
      NODE_ENV: development
      SPACES_MMO_BIND: 0.0.0.0
      PORT: "3900"
      SPACES_MMO_DATA: /data
      # the page may be opened as localhost too (Next's dev server serves its scripts only to known origins)
      SPACES_MMO_DEV_ORIGINS: "localhost"
    ports:
      # loopback only; 3920 so a game on 3900 or the local test bed on 3910 keeps running next to it
      - "127.0.0.1:${SPACES_MMO_DEV_PORT:-3920}:3900"
    volumes:
      - mmo-dev-data:/data
      - ../app:/opt/phi-spaces/spaces-mmo/app
      - ../client:/opt/phi-spaces/spaces-mmo/client
      - ../server:/opt/phi-spaces/spaces-mmo/server
      - ../worlds:/opt/phi-spaces/spaces-mmo/worlds
      - ../../src:/opt/phi-spaces/src
    working_dir: /opt/phi-spaces/spaces-mmo
    # space, world, npc and web (Next.js dev mode) as processes of their own: Next.js recompiles app/ and client/ on change
    # (Fast Refresh), and each process restarts when server/, worlds/ or the phi-spaces sources change
    command: ["node", "--no-warnings", "--experimental-strip-types", "server/launch.ts", "--dev"]

networks:
  mmo: {}

volumes:
  mmo-space-data: {}
  mmo-dev-data: {}
