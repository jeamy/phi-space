<!doctype html>
<html lang="de" data-mode="dark" data-palette="spaces_default">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>phi-spaces · Live Dashboard</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
	<span class="brand">PHI-<b>SPACES</b> <span class="sub">Live Dashboard</span></span>
	<span id="conn" class="conn offline"><i class="dot"></i><span id="conn-label">verbinde…</span></span>
	<span class="spacer"></span>
	<div class="theme-controls">
		<div class="mode-switch" role="group" aria-label="Modus">
			<button type="button" data-mode="dark" title="Dark Mode">☾</button>
			<button type="button" data-mode="light" title="Light Mode">☀</button>
		</div>
		<div class="theme-picker"><select id="palette" class="theme-picker__select" aria-label="Farbpalette"></select></div>
	</div>
</header>
<main id="layout">
	<nav class="stack">
		<apps-panel id="apps"></apps-panel>
		<spaces-panel id="spaces"></spaces-panel>
	</nav>
	<section>
		<app-detail id="app-detail" hidden></app-detail>
		<space-detail id="detail"></space-detail>
	</section>
	<aside class="stack">
		<apps-activity id="activity"></apps-activity>
		<apps-compare id="compare"></apps-compare>
		<live-metrics id="metrics"></live-metrics>
		<empty-panel heading="Agents & Mobiles" note="Keine Datenquelle für Agent- oder Geräteressourcen. Sichtbar sind ihre Wirkungen: Entries, Claims und Waits in den Spaces links. Sobald Geräte Heartbeats in einen Space schreiben, erscheinen sie hier."></empty-panel>
	</aside>
</main>
<chart-zoom id="zoom"></chart-zoom>
<script type="module" src="/app.js"></script>
</body>
</html>
