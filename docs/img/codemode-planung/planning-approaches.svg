<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 480" role="img" aria-labelledby="title"><title id="title">JEPA, generated bot programs and Jev workflows compared</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" fill="#65756c"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#20332b;font-size:17px}.title{font-size:24px;font-weight:700}.label{font-size:19px;font-weight:700}.small{font-size:15px;fill:#53665c}.line{stroke:#65756c;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><rect width="1080" height="480" rx="12" fill="#f7f8f3"/><text x="34" y="42" class="title"><tspan x="34" dy="0">Where the learned model sits</tspan></text><rect x="30" y="76" width="310" height="155" rx="8" fill="#e9effb" stroke="#c6d3c7"/><text x="50" y="107" class="label"><tspan x="50" dy="0">JEPA / LeWM</tspan></text><text x="50" y="138" class="small"><tspan x="50" dy="0">Images → encoder → embeddings</tspan><tspan x="50" dy="25">Action → predicted next embedding</tspan><tspan x="50" dy="25">Search action sequences in the model</tspan></text><path class="line" d="M185,231 L185,263"/><rect x="30" y="263" width="310" height="110" rx="8" fill="#ffffff" stroke="#c6d3c7"/><text x="50" y="294" class="label"><tspan x="50" dy="0">Planning and execution</tspan></text><text x="50" y="325" class="small"><tspan x="50" dy="0">Subgoals from a memory graph</tspan><tspan x="50" dy="25">Goal distance guides action search</tspan></text><rect x="385" y="76" width="310" height="155" rx="8" fill="#eaf2df" stroke="#c6d3c7"/><text x="405" y="107" class="label"><tspan x="405" dy="0">Code-generating agents</tspan></text><text x="405" y="138" class="small"><tspan x="405" dy="0">Task + tool examples → bot program</tspan><tspan x="405" dy="25">Judge evaluates episodes</tspan><tspan x="405" dy="25">Feedback → revised program</tspan></text><path class="line" d="M540,231 L540,263"/><rect x="385" y="263" width="310" height="110" rx="8" fill="#ffffff" stroke="#c6d3c7"/><text x="405" y="294" class="label"><tspan x="405" dy="0">Planning and execution</tspan></text><text x="405" y="325" class="small"><tspan x="405" dy="0">Bot builds a map and estimates rates</tspan><tspan x="405" dy="25">Program plans and acts during play</tspan></text><rect x="740" y="76" width="310" height="155" rx="8" fill="#f7eddf" stroke="#c6d3c7"/><text x="760" y="107" class="label"><tspan x="760" dy="0">Jev hybrid workflow</tspan></text><text x="760" y="138" class="small"><tspan x="760" dy="0">Observed state → typed questions</tspan><tspan x="760" dy="25">Model estimates candidate value</tspan><tspan x="760" dy="25">Code selects and executes a round</tspan></text><path class="line" d="M895,231 L895,263"/><rect x="740" y="263" width="310" height="110" rx="8" fill="#ffffff" stroke="#c6d3c7"/><text x="760" y="294" class="label"><tspan x="760" dy="0">Planning and execution</tspan></text><text x="760" y="325" class="small"><tspan x="760" dy="0">Code supplies routes and deadlines</tspan><tspan x="760" dy="25">Optional model subgoal and gate</tspan></text><text x="34" y="417" class="label"><tspan x="34" dy="0">Shared lesson: representation, goals, planning horizon and evaluation shape the result.</tspan></text><text x="34" y="451" class="small"><tspan x="34" dy="0">Model weights stay fixed during the reported experiments. The tasks and success metrics differ.</tspan></text></svg>