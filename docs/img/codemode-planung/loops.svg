<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14">
  <title>Two loops: the bot's within an episode, the agents' across generations</title>
  <style>
    .bg { fill: #ffffff; } .box { fill: #f3f5f8; stroke: #5b6472; stroke-width: 1.2; } .hot { fill: #e8f1ff; stroke: #2f6fd6; stroke-width: 1.4; }
    .warm { fill: #fff3e3; stroke: #c9771a; stroke-width: 1.4; } .t { fill: #1b2230; } .m { fill: #5b6472; font-size: 12px; } .h { fill: #1b2230; font-size: 16px; font-weight: 700; }
    .a { stroke: #5b6472; stroke-width: 1.4; fill: none; marker-end: url(#ar); } .tip { fill: #5b6472; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #141922; } .box { fill: #1e2531; stroke: #8d97a6; } .hot { fill: #182a46; stroke: #6ea2ff; } .warm { fill: #34261a; stroke: #e39a45; }
      .t, .h { fill: #e8ecf2; } .m { fill: #a3acba; } .a { stroke: #a3acba; } .tip { fill: #a3acba; }
    }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="tip" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="bg" width="960" height="400"/>
  <text class="h" x="30" y="36">Across generations (the agents learn, as code)</text>
  <rect class="box" x="30" y="60" width="190" height="64" rx="6"/><text class="t" x="125" y="86" text-anchor="middle">agents write a bot</text><text class="m" x="125" y="105" text-anchor="middle">plan, subgoals, code</text>
  <rect class="hot" x="270" y="60" width="210" height="64" rx="6"/><text class="t" x="375" y="86" text-anchor="middle">judge plays episodes</text><text class="m" x="375" y="105" text-anchor="middle">3 shown + 6 hidden, seeds, hold</text>
  <rect class="warm" x="530" y="60" width="190" height="64" rx="6"/><text class="t" x="625" y="86" text-anchor="middle">space</text><text class="m" x="625" y="105" text-anchor="middle">verdict, paths, observations</text>
  <rect class="box" x="770" y="60" width="160" height="64" rx="6"/><text class="t" x="850" y="86" text-anchor="middle">freeze</text><text class="m" x="850" y="105" text-anchor="middle">what the next may read</text>
  <path class="a" d="M220,92 L268,92"/><path class="a" d="M480,92 L528,92"/><path class="a" d="M720,92 L768,92"/>
  <path class="a" d="M850,124 C850,175 125,175 125,126"/>
  <text class="m" x="430" y="190" text-anchor="middle">next generation: critique, the case lines, the frozen memory</text>

  <text class="h" x="30" y="236">Within an episode (the bot learns, as data)</text>
  <rect class="box" x="30" y="252" width="160" height="60" rx="6"/><text class="t" x="110" y="287" text-anchor="middle">look()</text>
  <rect class="hot" x="240" y="252" width="200" height="60" rx="6"/><text class="t" x="340" y="277" text-anchor="middle">update its model</text><text class="m" x="340" y="296" text-anchor="middle">map G, the tide's minute</text>
  <rect class="box" x="490" y="252" width="180" height="60" rx="6"/><text class="t" x="580" y="277" text-anchor="middle">plan</text><text class="m" x="580" y="296" text-anchor="middle">route, when to be where</text>
  <rect class="box" x="720" y="252" width="210" height="60" rx="6"/><text class="t" x="825" y="277" text-anchor="middle">act / wait</text><text class="m" x="825" y="296" text-anchor="middle">every call one point</text>
  <path class="a" d="M190,282 L238,282"/><path class="a" d="M440,282 L488,282"/><path class="a" d="M670,282 L718,282"/>
  <path class="a" d="M825,312 C825,360 110,360 110,314"/>
  <text class="m" x="470" y="378" text-anchor="middle">until the goal holds or the calls or the day run out</text>
</svg>
