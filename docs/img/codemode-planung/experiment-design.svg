<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 495" role="img" aria-labelledby="title"><title id="title">Model generation and game evaluation are separate experimental levels</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" fill="#65756c"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#20332b;font-size:17px}.title{font-size:24px;font-weight:700}.label{font-size:19px;font-weight:700}.small{font-size:15px;fill:#53665c}.line{stroke:#65756c;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><rect width="1080" height="495" rx="12" fill="#f7f8f3"/><text x="34" y="42" class="title"><tspan x="34" dy="0">Two evaluation levels</tspan></text><rect x="30" y="76" width="310" height="130" rx="8" fill="#eaf2df" stroke="#c6d3c7"/><text x="50" y="107" class="label"><tspan x="50" dy="0">Generate a bot</tspan></text><text x="50" y="138" class="small"><tspan x="50" dy="0">3 agents · up to 5 generations</tspan><tspan x="50" dy="25">With / without tool-response example</tspan><tspan x="50" dy="25">10 runs per model and condition</tspan></text><path class="line" d="M340,141 L380,141"/><rect x="380" y="76" width="300" height="130" rx="8" fill="#ffffff" stroke="#c6d3c7"/><text x="400" y="107" class="label"><tspan x="400" dy="0">Judge each contribution</tspan></text><text x="400" y="138" class="small"><tspan x="400" dy="0">3 shown + 6 hidden episodes</tspan><tspan x="400" dy="25">8 seeds each in Shores of the Tide</tspan><tspan x="400" dy="25">Feedback returns to the next generation</tspan></text><path class="line" d="M680,141 L720,141"/><rect x="720" y="76" width="330" height="130" rx="8" fill="#e9effb" stroke="#c6d3c7"/><text x="740" y="107" class="label"><tspan x="740" dy="0">Select and test winners</tspan></text><text x="740" y="138" class="small"><tspan x="740" dy="0">60 valid model runs → 44 winners</tspan><tspan x="740" dy="25">94 fresh islands × 8 fresh seeds</tspan><tspan x="740" dy="25">A run without a winner counts as failure</tspan></text><text x="34" y="256" class="small"><tspan x="34" dy="0">A contribution has up to 72 game trajectories. A model run may generate many contributions.</tspan></text><rect x="30" y="294" width="310" height="125" rx="8" fill="#f7eddf" stroke="#c6d3c7"/><text x="50" y="325" class="label"><tspan x="50" dy="0">Evaluate a fixed Jev policy</tspan></text><text x="50" y="356" class="small"><tspan x="50" dy="0">Direct actions or hybrid rounds</tspan><tspan x="50" dy="25">9 task islands × 8 original seeds</tspan><tspan x="50" dy="25">No code-writing generations</tspan></text><path class="line" d="M340,356 L380,356"/><rect x="380" y="294" width="300" height="125" rx="8" fill="#ffffff" stroke="#c6d3c7"/><text x="400" y="325" class="label"><tspan x="400" dy="0">Check the episode mean</tspan></text><text x="400" y="356" class="small"><tspan x="400" dy="0">Delivered wood, averaged over 8 seeds</tspan><tspan x="400" dy="25">Target from the reference plan</tspan><tspan x="400" dy="25">Tool calls and model requests separate</tspan></text><path class="line" d="M680,356 L720,356"/><rect x="720" y="294" width="330" height="125" rx="8" fill="#ffffff" stroke="#c6d3c7"/><text x="740" y="325" class="label"><tspan x="740" dy="0">Compare controls</tspan></text><text x="740" y="356" class="small"><tspan x="740" dy="0">Counted rates on the same rounds</tspan><tspan x="740" dy="25">Equal value for logged landing rooms</tspan><tspan x="740" dy="25">One evaluation per Jev policy</tspan></text><text x="34" y="466" class="small"><tspan x="34" dy="0">Jev transfer to the 94 fresh islands remains open. Push-T results belong to a separate benchmark.</tspan></text></svg>