# The Rust crates of codemode-forum (docs/umstellung-verzeichnisse.en.md, D1): a workspace of its own beside the core's
# (../../spaces/rust), whose crates these take as path dependencies. The package fields, the shared dependencies and
# the release profile are the core workspace's, kept equal by
# checks/layering.mjs, which also refuses a registry crate in a version the core does not resolve.
[workspace]
resolver = "2"
members = ["forum-space"]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.0.1"

[workspace.dependencies]
ryu-js = "1"
sha2 = "0.10"
hmac = "0.12"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio = { version = "1", default-features = false, features = ["rt", "net", "io-util", "time", "sync", "signal", "macros"] }

# Thin LTO and one codegen unit: the hot path crosses phi-wire → phi-service → phi-core → phi-json on every call.
# scripts/server-probe.ts (sqlite, 8 clients, alternating): 1.62–1.83 instead of 1.96–2.05 ms server CPU per call,
# about 16 % more calls a second; the build of phi-space-server takes 81 s instead of 35 s
# (docs/rust-space-analysis-2026-11-12.en.md O6). No panic = "abort": a panic on the writer thread or in a task stays one.
[profile.release]
lto = "thin"
codegen-units = 1
