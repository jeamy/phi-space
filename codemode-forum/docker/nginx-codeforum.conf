# nginx on big for FORUM (docs/forum-seite-plan-2026-11-26.en.md, section 13), as for codemode and spaces-files:
# /etc/nginx/sites-available/codeforum.eibrain.org, linked into sites-enabled. The certificate comes from certbot
# (webroot /var/www/acme). The web container listens on 127.0.0.1:4100 with plain HTTP (docker-compose.hostnet.yml);
# the session cookie is Secure because X-Forwarded-Proto says https, and the request quota counts the last
# X-Forwarded-For hop, the client's address that /etc/nginx/conf.d/01-cloudflare-realip.conf puts in $remote_addr.
# The page's WebSocket (/ws/) needs the upgrade headers. Uploads are JSON (documents of a task: 800 kB together).
server {
    listen 80;
    listen [::]:80;
    server_name codeforum.eibrain.org;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    include /etc/nginx/snippets/cms-probe-block.conf;

    listen 443 ssl;
    listen [::]:443 ssl;
    listen [2a0a:4cc0:c0:62f2:8000::1002]:443 ssl;
    server_name codeforum.eibrain.org;

    ssl_certificate /etc/letsencrypt/live/codeforum.eibrain.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/codeforum.eibrain.org/privkey.pem;

    access_log /var/log/nginx/codeforum.eibrain.org.log;
    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
