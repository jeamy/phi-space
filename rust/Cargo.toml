# The Rust port of phi-spaces (docs/rust-portierung.md). Crates are added phase by phase; the TypeScript code in src/
# stays the reference, and test/vectors/ is what both must agree on.
[workspace]
resolver = "2"
members = ["phi-json", "phi-core", "phi-store", "phi-service", "phi-wire", "phi-space-server"]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.0.1"

[workspace.dependencies]
ryu-js = "1"
sha2 = "0.10"
hmac = "0.12"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", default-features = false, features = ["rt", "net", "io-util", "time", "sync", "signal", "macros"] }
