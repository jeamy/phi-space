[package]
name = "phi-host"
description = "The secure host around the space service: key proofs, gate, enrollment, grants, rotation and the supervisor (docs/rust-portierung.en.md, R5)"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
phi-json = { path = "../phi-json" }
phi-service = { path = "../phi-service" }
phi-wire = { path = "../phi-wire" }
phi-core = { path = "../phi-core" }
phi-store = { path = "../phi-store" }
sha2.workspace = true
rusqlite.workspace = true
tokio-rustls.workspace = true
webpki-roots = "1"
tokio.workspace = true
ed25519-dalek = "2"
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8", "std"] }
getrandom = "0.2"
