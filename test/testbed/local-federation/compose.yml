# A federation on this machine, a project of its own beside the other local containers: register, directory, a control host
# (CONTROL_IMPL: rust or ts), one Member (MEMBER_IMPL: rust or ts) and a client. Each has its own address on its own network, and the gate knows a
# peer by that address. `npm run testbed:federation` provisions FED_DIR, starts this, and breaks it on purpose.
name: phi-federation

x-host: &host
  image: phi-federation:local
  pull_policy: never
  init: true
  user: "${FED_UID}:${FED_GID}"
  volumes: ["${FED_DIR}:/fed"]
  working_dir: /opt/phi-spaces

services:
  register:
    <<: *host
    command: ["phi-space-server", "--tls-register", "/fed/register.json"]
    networks: {fed: {ipv4_address: 172.30.7.2}}
  management:
    <<: *host
    command: ["node", "--experimental-strip-types", "--no-warnings", "test/testbed/local-federation/host.ts", "management"]
    networks: {fed: {ipv4_address: 172.30.7.3}}
  control:
    <<: *host
    command: ["node", "--experimental-strip-types", "--no-warnings", "test/testbed/local-federation/host.ts", "control", "${CONTROL_IMPL:-ts}"]
    depends_on: [register, management]
    restart: on-failure:20
    ports: ["${FED_PHONE_BIND:-127.0.0.1}:7431:7431"]
    networks: {fed: {ipv4_address: 172.30.7.4}}
  member:
    <<: *host
    command: ["node", "--experimental-strip-types", "--no-warnings", "test/testbed/local-federation/host.ts", "member", "${MEMBER_IMPL:-rust}"]
    depends_on: [control]
    restart: on-failure:20
    ports: ["${FED_PHONE_BIND:-127.0.0.1}:7432:7432"]
    networks: {fed: {ipv4_address: 172.30.7.5}}
  replica-a:
    <<: *host
    profiles: [replica]
    command: ["node", "--experimental-strip-types", "--no-warnings", "test/testbed/local-federation/replica-host.ts", "run", "replica-a"]
    restart: on-failure:20
    networks: {fed: {ipv4_address: 172.30.7.9}}
  replica-b:
    <<: *host
    profiles: [replica]
    command: ["node", "--experimental-strip-types", "--no-warnings", "test/testbed/local-federation/replica-host.ts", "run", "replica-b"]
    restart: on-failure:20
    networks: {fed: {ipv4_address: 172.30.7.10}}
  # `run.ts change`: the control host on a primary/sync main store, in place of `control` and at its address, and its standby
  control-a:
    <<: *host
    profiles: [change]
    command: ["node", "--experimental-strip-types", "--no-warnings", "test/testbed/local-federation/replica-host.ts", "run", "control"]
    restart: on-failure:20
    networks: {fed: {ipv4_address: 172.30.7.4}}
  control-b:
    <<: *host
    profiles: [change, restore]
    command: ["node", "--experimental-strip-types", "--no-warnings", "test/testbed/local-federation/replica-host.ts", "run", "control-b"]
    restart: on-failure:20
    networks: {fed: {ipv4_address: 172.30.7.12}}
  # `run.ts restore`: sshd as the independent fence status endpoint (one login per fenced host, docker read through its socket), and a restore target
  fence-ssh:
    <<: *host
    profiles: [restore]
    user: "0:0"
    volumes: ["${FED_DIR}:/fed", "/var/run/docker.sock:/var/run/docker.sock"]
    command: ["sh", "-c", "groupadd -g $$(stat -c %g /var/run/docker.sock) dockerhost && for u in data-host control-host control-host-b; do useradd -M -o -u ${FED_UID} -s /bin/sh -G dockerhost $$u && usermod -p '*' $$u; done && mkdir -p /run/sshd && exec /usr/sbin/sshd -D -e -f /fed/ssh/sshd_config"]
    networks: {fed: {ipv4_address: 172.30.7.13}}
  data-b:
    <<: *host
    profiles: [restore]
    volumes: ["${FED_DIR}:/fed", "${FED_DIR}/passwd:/etc/passwd:ro"]
    command: ["node", "--experimental-strip-types", "--no-warnings", "test/testbed/local-federation/host.ts", "member", "ts", "data-b"]
    restart: on-failure:20
    networks: {fed: {ipv4_address: 172.30.7.14}}
  client:
    <<: *host
    command: ["sleep", "infinity"]
    networks: {fed: {ipv4_address: 172.30.7.7}}
  router:
    <<: *host
    command: ["sleep", "infinity"]
    networks: {fed: {ipv4_address: 172.30.7.8}}

networks:
  fed:
    ipam:
      config: [{subnet: 172.30.7.0/24}]
