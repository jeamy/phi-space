# pi-spaces remote test bed. testbed.sh installs this as docker-compose.yml on the server (only if missing; `init --force`
# overwrites). Settings come from the .env next to it. No ports are published: containers talk over the private network.
# The server runs rootless docker (one daemon per user): container root is the host user, bind mounts stay owned by it.
#
# Production-like: the image holds the built artifacts only (no sources, no bind mounts), NODE_ENV=production, an
# unprivileged user, a read-only root filesystem with a tmpfs /tmp, and all capabilities dropped. State lives in /data.
# Containers idle (`sleep infinity`); scenarios and, later, pi-serverd / gate / supervisor processes are started in them.
# Each host has its own /data volume, so storage is never shared between hosts and survives a container kill.
name: ${TESTBED_PROJECT:-pi-spaces-test}

x-env: &env
  NODE_ENV: production
  TESTBED: "1"

x-node: &node
  image: ${TESTBED_PROJECT:-pi-spaces-test}-node:local
  pull_policy: never # built by testbed.sh (docker compose build runner), never pulled
  init: true
  restart: unless-stopped
  working_dir: /opt/app
  user: node
  read_only: true
  tmpfs: ["/tmp"]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: ${TESTBED_PIDS_LIMIT:-1024}
  mem_limit: ${TESTBED_MEM_LIMIT:-512m}
  cpus: ${TESTBED_CPUS:-0.5}
  environment: *env

services:
  # Runs the compiled examples and scenarios (smoke, examples, sieve-mobile). Always part of the bed.
  runner:
    <<: *node
    build:
      context: .
      args:
        NODE_IMAGE: ${TESTBED_NODE_IMAGE:-node:22-bookworm-slim}
    hostname: runner
    networks: [testnet]
    mem_limit: ${TESTBED_RUNNER_MEM:-2g}
    cpus: ${TESTBED_RUNNER_CPUS:-2.0}
    volumes: ["runner-data:/data"]

  # Federation topology (profile "federation", needs the "overlay" agents: `up federation` starts both). Each host shares the network
  # namespace of its NetBird agent nb-<host>, so it has the overlay interface wt0 and the overlay address of its peer; hostnames and
  # the testnet alias belong to the agent. Idle until the stages that need them exist (v3 stage 1b onwards), or a scenario runs in them.
  host-a: # coordinator: control space primary, router, supervisor, recovery space
    <<: *node
    profiles: [federation]
    network_mode: "service:nb-host-a" # the host lives in its overlay agent's network namespace: wt0 is its only way to the others
    depends_on: [nb-host-a]
    environment: {<<: *env, TESTBED_ROLE: coordinator, TESTBED_HOST_ID: host-a}
    volumes: ["host-a-data:/data"]

  host-b: # fixed synchronous standby of the coordinator (own failure domain in the model)
    <<: *node
    profiles: [federation]
    network_mode: "service:nb-host-b" # the host lives in its overlay agent's network namespace: wt0 is its only way to the others
    depends_on: [nb-host-b]
    environment: {<<: *env, TESTBED_ROLE: standby, TESTBED_HOST_ID: host-b}
    volumes: ["host-b-data:/data"]

  member-1: # data member
    <<: *node
    profiles: [federation]
    network_mode: "service:nb-member-1" # the host lives in its overlay agent's network namespace: wt0 is its only way to the others
    depends_on: [nb-member-1]
    environment: {<<: *env, TESTBED_ROLE: member, TESTBED_HOST_ID: member-1}
    volumes: ["member-1-data:/data"]

  member-2: # data member
    <<: *node
    profiles: [federation]
    network_mode: "service:nb-member-2" # the host lives in its overlay agent's network namespace: wt0 is its only way to the others
    depends_on: [nb-member-2]
    environment: {<<: *env, TESTBED_ROLE: member, TESTBED_HOST_ID: member-2}
    volumes: ["member-2-data:/data"]

  # NetBird overlay peers (profile "overlay"): one agent container per federation host, joined with the space-hosts setup key
  # (written by `netbird setup` to <dir>/netbird/peer-hosts.env: NB_SETUP_KEY + NB_MANAGEMENT_URL, nothing else). They are
  # separate peers for now; the hosts will share their network namespace once the userspace WireGuard mode is proven under
  # rootless docker. The agent needs /dev/net/tun and NET_ADMIN, so it cannot use the hardened profile of the node containers.
  nb-host-a: &nb-agent
    image: ${NETBIRD_AGENT_IMAGE:-netbirdio/netbird:0.80.0}
    pull_policy: missing
    profiles: [overlay]
    init: true
    restart: unless-stopped
    hostname: nb-host-a
    env_file: [{path: ./netbird/peer-hosts.env, required: false}] # optional: every command runs with all profiles enabled
    environment: {NB_HOSTNAME: host-a}
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    security_opt: [no-new-privileges:true]
    pids_limit: 512
    mem_limit: 512m
    networks: [testnet]
    volumes: ["nb-host-a:/var/lib/netbird"]
  nb-host-b:
    <<: *nb-agent
    hostname: nb-host-b
    environment: {NB_HOSTNAME: host-b}
    volumes: ["nb-host-b:/var/lib/netbird"]
  nb-member-1:
    <<: *nb-agent
    hostname: nb-member-1
    environment: {NB_HOSTNAME: member-1}
    volumes: ["nb-member-1:/var/lib/netbird"]
  nb-member-2:
    <<: *nb-agent
    hostname: nb-member-2
    environment: {NB_HOSTNAME: member-2}
    volumes: ["nb-member-2:/var/lib/netbird"]

networks:
  testnet:
    driver: bridge

volumes:
  nb-host-a: {}
  nb-host-b: {}
  nb-member-1: {}
  nb-member-2: {}
  runner-data: {}
  host-a-data: {}
  host-b-data: {}
  member-1-data: {}
  member-2-data: {}
