# pi-spaces remote test bed. testbed.sh installs this as docker-compose.yml on the server (only if missing; `init --force`
# overwrites). Settings come from the .env next to it. No ports are published: containers talk over the private network.
# The server runs rootless docker (one daemon per user): container root is the host user, bind mounts stay owned by it.
#
# Production-like: the image holds the built artifacts only (no sources, no bind mounts), NODE_ENV=production, an
# unprivileged user, a read-only root filesystem with a tmpfs /tmp, and all capabilities dropped. State lives in /data.
# Containers idle (`sleep infinity`); scenarios and, later, pi-serverd / gate / supervisor processes are started in them.
# Each host has its own /data volume, so storage is never shared between hosts and survives a container kill.
name: ${TESTBED_PROJECT:-pi-spaces-test}

x-env: &env
  NODE_ENV: production
  TESTBED: "1"

x-node: &node
  image: ${TESTBED_PROJECT:-pi-spaces-test}-node:local
  pull_policy: never # built by testbed.sh (docker compose build runner), never pulled
  init: true
  restart: unless-stopped
  working_dir: /opt/app
  user: node
  read_only: true
  tmpfs: ["/tmp"]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: ${TESTBED_PIDS_LIMIT:-1024}
  mem_limit: ${TESTBED_MEM_LIMIT:-512m}
  cpus: ${TESTBED_CPUS:-0.5}
  networks: [testnet]
  environment: *env

services:
  # Runs the compiled examples and scenarios (smoke, examples, sieve-mobile). Always part of the bed.
  runner:
    <<: *node
    build:
      context: .
      args:
        NODE_IMAGE: ${TESTBED_NODE_IMAGE:-node:22-bookworm-slim}
    hostname: runner
    mem_limit: ${TESTBED_RUNNER_MEM:-2g}
    cpus: ${TESTBED_RUNNER_CPUS:-2.0}
    volumes: ["runner-data:/data"]

  # Federation topology (profile "federation"). Idle until the stages that need them exist (v3 stage 1b onwards).
  host-a: # coordinator: control space primary, router, supervisor, recovery space
    <<: *node
    profiles: [federation]
    hostname: host-a
    environment: {<<: *env, TESTBED_ROLE: coordinator, TESTBED_HOST_ID: host-a}
    volumes: ["host-a-data:/data"]

  host-b: # fixed synchronous standby of the coordinator (own failure domain in the model)
    <<: *node
    profiles: [federation]
    hostname: host-b
    environment: {<<: *env, TESTBED_ROLE: standby, TESTBED_HOST_ID: host-b}
    volumes: ["host-b-data:/data"]

  member-1: # data member
    <<: *node
    profiles: [federation]
    hostname: member-1
    environment: {<<: *env, TESTBED_ROLE: member, TESTBED_HOST_ID: member-1}
    volumes: ["member-1-data:/data"]

  member-2: # data member
    <<: *node
    profiles: [federation]
    hostname: member-2
    environment: {<<: *env, TESTBED_ROLE: member, TESTBED_HOST_ID: member-2}
    volumes: ["member-2-data:/data"]

networks:
  testnet:
    driver: bridge

volumes:
  runner-data: {}
  host-a-data: {}
  host-b-data: {}
  member-1-data: {}
  member-2-data: {}
