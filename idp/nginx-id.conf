# nginx on big for the identity provider (docs/forum-seite-plan-2026-11-26.en.md, section 13; idp/README.md "On big"):
# /etc/nginx/sites-available/id.eibrain.org, linked into sites-enabled. The certificate comes from certbot (webroot
# /var/www/acme). Keycloak listens on 127.0.0.1:4300 with plain HTTP (KC_PROXY_HEADERS=xforwarded). Only the realms
# (sign-in, tokens, discovery, sign-out) and the static resources of their pages are passed on; the admin console and
# everything else answer 404 here and are reached through an ssh tunnel to the loopback port.
server {
    listen 80;
    listen [::]:80;
    server_name id.eibrain.org;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    include /etc/nginx/snippets/cms-probe-block.conf;

    listen 443 ssl;
    listen [::]:443 ssl;
    listen [2a0a:4cc0:c0:62f2:8000::1002]:443 ssl;
    server_name id.eibrain.org;

    ssl_certificate /etc/letsencrypt/live/id.eibrain.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/id.eibrain.org/privkey.pem;

    access_log /var/log/nginx/id.eibrain.org.log;

    location ^~ /realms/master/ {
        return 404;
    }

    location ~ ^/(realms|resources)/ {
        proxy_pass http://127.0.0.1:4300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
    }

    location / {
        return 404;
    }
}
