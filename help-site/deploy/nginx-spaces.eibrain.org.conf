# Nginx Reverse-Proxy Configuration for https://spaces.eibrain.org
# Proxies HTTPS and WebSocket (/ws/chat/:sessionId) traffic to the local Node.js PI-SPACES / HELP server on 127.0.0.1:8790.

server {
    listen 80;
    listen [::]:80;
    server_name spaces.eibrain.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name spaces.eibrain.org;

    ssl_certificate     /etc/letsencrypt/live/spaces.eibrain.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/spaces.eibrain.org/privkey.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # WebSocket Upgrade for Multiplayer Space-Chat
    location /ws/chat/ {
        proxy_pass http://127.0.0.1:3500;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # Help Corpus, React App, Chat REST API & Login-Protected AdminSpaces API
    location / {
        proxy_pass http://127.0.0.1:3500;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
