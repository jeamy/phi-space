# The Rust space server in the swarm's Space containers (docs/rust-portierung.en.md): `help-space` reads the same
# environment as server/space-host.ts, on the same volumes and files. `npm run docker:prod:rust:up` (big) and
# `docker:nano:rust:up` (nano) lay this over docker-compose.yml; docker:prod:up / docker:nano:up refuse: since
# 2026-11-12 big and nano run only the Rust Space server (R-D12). The hub and the shard engine stay TypeScript.
services:
  swarm-space:
    image: phi-spaces-help:rust
    command: ["/usr/local/bin/help-space"]
  swarm-space-nano:
    image: phi-spaces-help:rust
    command: ["/usr/local/bin/help-space"]
