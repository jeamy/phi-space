# Docker Compose for PHI-SPACES / CODEMODE CHAT
#   1. `codemode-chat-prod`: hardened production hub ("big": Next.js 16 + WebSocket + SQLite in /data)
#   2. `codemode-chat-test`: test run in Docker (profile: test)
#   3. `codemode-chat-dev`:  interactive Next.js dev server in Docker (profile: dev)
#   4. `codemode-nano`:      headless judge shard for the big/nano two-host setup (profile: nano)
# Like the help system: prod and nano are two separate servers (big and nano), started from their own .env.
# Ports: 3700 (hub), 3800 (shard) — the help system uses 3500/3600.

name: phi-spaces-codemode

services:
  # ---- 1. Production hub ("big") ----
  codemode-chat-prod:
    build:
      context: ../..
      dockerfile: codemode-chat/docker/Dockerfile
      target: production
    image: phi-spaces-codemode:prod
    container_name: phi-spaces-codemode-prod
    init: true
    restart: unless-stopped
    user: "node"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    env_file:
      - path: ../.env
        required: false
    environment:
      NODE_ENV: production
      # Host networking: the app binds the host interface directly, so HOST_BIND=127.0.0.1 keeps it loopback-only for
      # the reverse proxy, and CODEMODE_REMOTE can reach host-local sockets (e.g. an SSH tunnel on 127.0.0.1:<port>)
      # as tcp:127.0.0.1:<port>.
      CODEMODE_BIND: "${HOST_BIND:-0.0.0.0}"
      PORT: "${PORT:-3700}"
      CODEMODE_SQLITE: /data/codemode-chat.sqlite
      CODEMODE_HOST_NAME: "${CODEMODE_HOST_NAME:-}"
    network_mode: host
    volumes:
      - codemode-chat-data:/data
      # Optional: mount the host's pi CLI credentials so model agents work (or set API keys in .env). PI_AUTH_DIR= skips.
      - "${PI_AUTH_DIR:-${HOME}/.pi/agent}:/home/node/.pi/agent:ro"

  # ---- 2. Tests in Docker ----
  codemode-chat-test:
    build:
      context: ../..
      dockerfile: codemode-chat/docker/Dockerfile
      target: dev-test
    image: phi-spaces-codemode:dev-test
    profiles:
      - test
    init: true
    user: "node"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    env_file:
      - path: ../.env
        required: false
    environment:
      NODE_ENV: test
      CODEMODE_CHAT_LLM: "0"
    command: ["npm", "--prefix", "codemode-chat", "test"]

  # ---- 3. Local development server in Docker ----
  codemode-chat-dev:
    build:
      context: ../..
      dockerfile: codemode-chat/docker/Dockerfile
      target: dev-test
    image: phi-spaces-codemode:dev-test
    profiles:
      - dev
    init: true
    user: "node"
    env_file:
      - path: ../.env
        required: false
    environment:
      NODE_ENV: development
      CODEMODE_BIND: 0.0.0.0
      PORT: "${PORT:-3700}"
      CODEMODE_SQLITE: /data/dev-codemode-chat.sqlite
    ports:
      - "${HOST_BIND:+$HOST_BIND:}${PORT:-3700}:${PORT:-3700}"
    volumes:
      - codemode-chat-dev-data:/data
      - ../app:/opt/phi-spaces/codemode-chat/app
      - ../client:/opt/phi-spaces/codemode-chat/client
      - ../server:/opt/phi-spaces/codemode-chat/server
      - ../../src:/opt/phi-spaces/src
      # Optional: mount the host's pi CLI credentials so model agents work in dev (PI_AUTH_DIR= to skip).
      - "${PI_AUTH_DIR:-${HOME}/.pi/agent}:/home/node/.pi/agent:ro"
    working_dir: /opt/phi-spaces/codemode-chat
    # The sources are mounted from the checkout: Next.js recompiles app/ and client/ on change (Fast Refresh), and
    # --watch-path restarts the server when server/ or the phi-spaces sources change.
    command: ["node", "--watch-path=server", "--watch-path=../src", "--no-warnings", "--experimental-strip-types", "server/index.ts", "--dev"]

  # ---- 4. Headless judge shard (profile: nano — deploy on the `nano` host) ----
  codemode-nano:
    build:
      context: ../..
      dockerfile: codemode-chat/docker/Dockerfile
      target: nano
    image: phi-spaces-codemode:nano
    container_name: phi-spaces-codemode-nano
    profiles:
      - nano
    init: true
    restart: unless-stopped
    user: "node"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    env_file:
      - path: ../.env
        required: false
    environment:
      NODE_ENV: production
      CODEMODE_LISTEN: "${CODEMODE_LISTEN:-tcp:0.0.0.0:3800}"
      CODEMODE_DB: /data/codemode-b.sqlite
      CODEMODE_HOST_NAME: "${CODEMODE_HOST_NAME:-}"
      CODEMODE_JUDGES: "${CODEMODE_JUDGES:-2}"
    ports:
      # Set CODEMODE_SHARD_BIND to the host's internal (LAN/NetBird) IP to keep the shard socket off the public
      # interface — serveSpace has no TLS.
      - "${CODEMODE_SHARD_BIND:+$CODEMODE_SHARD_BIND:}3800:3800"
    volumes:
      - codemode-nano-data:/data

volumes:
  codemode-chat-data: {}
  codemode-chat-dev-data: {}
  codemode-nano-data: {}
