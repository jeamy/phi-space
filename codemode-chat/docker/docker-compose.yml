# Docker Compose for PHI-SPACES / CODEMODE CHAT: one container per role, all from the one `production` image, talking
# only through the space over TCP (docs/codemode-space-architektur.md).
#
#   profile nano:  space (SQLite in a volume) and a judge            — the host that keeps the state
#   profile big:   web, a judge, agents and the model process        — the host that does most of the work
#   both at once:  the big/nano pair on one machine (local test bed): the same TCP connections as between two hosts,
#                  host names "nano" and "big" in the system bar, NANO_CPUS caps nano's CPUs like the smaller machine
#   profile dev:   all roles in one container with the checkout mounted, restarted on every change
#   profile test:  the test suite
#
# On two real hosts, big reaches nano's space at CODEMODE_SPACE=tcp:<nano's internal address>:3800 (its .env), and nano
# publishes the space on CODEMODE_SPACE_BIND (its internal LAN/NetBird address). The space socket has no TLS and treats
# every connection as a process of the chat: never publish it on a public interface.
# Ports: 3700 (web), 3800 (space) — the help system uses 3500/3600.

name: phi-spaces-codemode

x-role: &role
  # every role container is built from the same image (built once, the others reuse it)
  build:
    context: ../..
    dockerfile: codemode-chat/docker/Dockerfile
    target: production
  image: phi-spaces-codemode:prod
  init: true
  restart: unless-stopped
  user: "node"
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp
  env_file:
    - path: ../.env
      required: false
  networks:
    - chat

x-big: &big
  <<: *role
  depends_on:
    space:
      condition: service_healthy
      required: false

services:
  # ---- nano: the space and a judge ----
  space:
    <<: *role
    profiles: [nano]
    command: ["node", "--no-warnings", "--experimental-strip-types", "server/space-host.ts"]
    environment:
      NODE_ENV: production
      CODEMODE_LISTEN: tcp:0.0.0.0:3800
      CODEMODE_SQLITE: /data/codemode-space.sqlite
      CODEMODE_HOST_NAME: "${NANO_HOST_NAME:-nano}"
    cpus: "${NANO_CPUS:-0}"
    ports:
      # loopback by default; on the nano host set CODEMODE_SPACE_BIND to its internal address for big
      - "${CODEMODE_SPACE_BIND:-127.0.0.1}:${CODEMODE_SPACE_PORT:-3800}:3800"
    volumes:
      - codemode-space-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('net').connect(3800,'127.0.0.1');s.once('connect',()=>{s.end();process.exit(0)});s.once('error',()=>process.exit(1));setTimeout(()=>process.exit(1),4000)"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3

  judge-nano:
    <<: *role
    profiles: [nano]
    command: ["node", "--no-warnings", "--experimental-strip-types", "server/judge-host.ts"]
    environment:
      NODE_ENV: production
      CODEMODE_SPACE: tcp:space:3800
      CODEMODE_HOST_NAME: "${NANO_HOST_NAME:-nano}"
      CODEMODE_JUDGES: "${NANO_JUDGES:-1}"
    cpus: "${NANO_CPUS:-0}"
    depends_on:
      space:
        condition: service_healthy

  # ---- big: web, a judge, agents, the model process ----
  web:
    <<: *big
    profiles: [big]
    command: ["node", "--no-warnings", "--experimental-strip-types", "server/index.ts"]
    environment:
      NODE_ENV: production
      CODEMODE_SPACE: "${CODEMODE_SPACE:-tcp:space:3800}"
      CODEMODE_HOST_NAME: "${BIG_HOST_NAME:-big}"
      CODEMODE_BIND: 0.0.0.0
      PORT: "3700"
    ports:
      # loopback by default, for the reverse proxy in front (deploy/Caddyfile, deploy/nginx-codemode.conf)
      - "${HOST_BIND:-127.0.0.1}:${PORT:-3700}:3700"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3700/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

  judge-big:
    <<: *big
    profiles: [big]
    command: ["node", "--no-warnings", "--experimental-strip-types", "server/judge-host.ts"]
    environment:
      NODE_ENV: production
      CODEMODE_SPACE: "${CODEMODE_SPACE:-tcp:space:3800}"
      CODEMODE_HOST_NAME: "${BIG_HOST_NAME:-big}"
      CODEMODE_JUDGES: "${BIG_JUDGES:-2}"

  agents:
    <<: *big
    profiles: [big]
    command: ["node", "--no-warnings", "--experimental-strip-types", "server/agent-host.ts"]
    environment:
      NODE_ENV: production
      CODEMODE_SPACE: "${CODEMODE_SPACE:-tcp:space:3800}"
      CODEMODE_HOST_NAME: "${BIG_HOST_NAME:-big}"

  model:
    <<: *big
    profiles: [big]
    command: ["node", "--no-warnings", "--experimental-strip-types", "server/model-host.ts"]
    environment:
      NODE_ENV: production
      CODEMODE_SPACE: "${CODEMODE_SPACE:-tcp:space:3800}"
      CODEMODE_HOST_NAME: "${BIG_HOST_NAME:-big}"
    volumes:
      # the only process with model credentials: the host's pi CLI login (or API keys in .env); PI_AUTH_DIR= skips it
      - "${PI_AUTH_DIR:-${HOME}/.pi/agent}:/home/node/.pi/agent:ro"

  # ---- tests in Docker ----
  codemode-chat-test:
    build:
      context: ../..
      dockerfile: codemode-chat/docker/Dockerfile
      target: dev-test
    image: phi-spaces-codemode:dev-test
    profiles: [test]
    init: true
    user: "node"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    env_file:
      - path: ../.env
        required: false
    environment:
      NODE_ENV: test
      CODEMODE_CHAT_LLM: "0"
    command: ["npm", "--prefix", "codemode-chat", "test"]

  # ---- development: every role in one container, the checkout mounted ----
  codemode-chat-dev:
    build:
      context: ../..
      dockerfile: codemode-chat/docker/Dockerfile
      target: dev-test
    image: phi-spaces-codemode:dev-test
    profiles: [dev]
    init: true
    user: "node"
    env_file:
      - path: ../.env
        required: false
    environment:
      NODE_ENV: development
      CODEMODE_HOST_NAME: "${CODEMODE_HOST_NAME:-dev}"
      CODEMODE_BIND: 0.0.0.0
      PORT: "${PORT:-3700}"
      CODEMODE_SQLITE: /data/dev-codemode-space.sqlite
    ports:
      - "${HOST_BIND:+$HOST_BIND:}${PORT:-3700}:${PORT:-3700}"
    volumes:
      - codemode-chat-dev-data:/data
      - ../app:/opt/phi-spaces/codemode-chat/app
      - ../client:/opt/phi-spaces/codemode-chat/client
      - ../server:/opt/phi-spaces/codemode-chat/server
      - ../../src:/opt/phi-spaces/src
      # Optional: mount the host's pi CLI credentials so model agents work in dev (PI_AUTH_DIR= to skip).
      - "${PI_AUTH_DIR:-${HOME}/.pi/agent}:/home/node/.pi/agent:ro"
    working_dir: /opt/phi-spaces/codemode-chat
    # space, judge, agents, model and web (Next.js dev mode) as processes of their own: Next.js recompiles app/ and
    # client/ on change (Fast Refresh), and each process restarts when server/ or the phi-spaces sources change
    command: ["node", "--no-warnings", "--experimental-strip-types", "server/launch.ts", "--dev"]

networks:
  chat: {}

volumes:
  codemode-space-data: {}
  codemode-chat-dev-data: {}
