# nginx example for the codemode chat (replace the host name and the certificate paths).
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 443 ssl;
    server_name codemode.example.org;
    ssl_certificate     /etc/letsencrypt/live/codemode.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/codemode.example.org/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3700;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # the hub's per-IP quota reads the last X-Forwarded-For hop: set it to the client, never pass the client's own
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}
