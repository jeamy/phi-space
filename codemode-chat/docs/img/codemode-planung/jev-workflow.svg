<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 648" role="img" aria-labelledby="title"><title id="title">Typed subgoal, value and delivery decisions in the Jev workflow</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" fill="#65756c"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#20332b;font-size:17px}.title{font-size:24px;font-weight:700}.label{font-size:19px;font-weight:700}.small{font-size:15px;fill:#53665c}.line{stroke:#65756c;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><rect width="1080" height="648" rx="12" fill="#f7f8f3"/><text x="34" y="42" class="title"><tspan x="34" dy="0">Expanded Jev workflow</tspan></text><text x="34" y="81" class="small"><tspan x="34" dy="0">CODE</tspan></text><text x="388" y="81" class="small"><tspan x="388" dy="0">JEV QUESTIONS</tspan></text><text x="745" y="81" class="small"><tspan x="745" dy="0">CODE</tspan></text><rect x="30" y="110" width="310" height="130" rx="8" fill="#eaf2df" stroke="#c6d3c7"/><text x="50" y="141" class="label"><tspan x="50" dy="0">Observe and prepare</tspan></text><text x="50" y="172" class="small"><tspan x="50" dy="0">Explore rooms through game tools</tspan><tspan x="50" dy="25">Read historical logbook</tspan><tspan x="50" dy="25">Compute paths, times and call bounds</tspan></text><path class="line" d="M340,175 L380,175"/><rect x="380" y="110" width="310" height="105" rx="8" fill="#f7eddf" stroke="#c6d3c7"/><text x="400" y="141" class="label"><tspan x="400" dy="0">Choose a subgoal</tspan></text><text x="400" y="172" class="small"><tspan x="400" dy="0">Collect · deliver · finish</tspan><tspan x="400" dy="25">Allowed choices supplied by code</tspan></text><path class="line" d="M535,215 L535,250"/><rect x="380" y="250" width="310" height="105" rx="8" fill="#f7eddf" stroke="#c6d3c7"/><text x="400" y="281" class="label"><tspan x="400" dy="0">Estimate round value</tspan></text><text x="400" y="312" class="small"><tspan x="400" dy="0">P(at least 1 new piece), P(at least 2)…</tspan><tspan x="400" dy="25">Sum the tail probabilities</tspan></text><path class="line" d="M535,355 L535,390"/><rect x="380" y="390" width="310" height="105" rx="8" fill="#f7eddf" stroke="#c6d3c7"/><text x="400" y="421" class="label"><tspan x="400" dy="0">Check delivery feasibility</tspan></text><text x="400" y="452" class="small"><tspan x="400" dy="0">Separate probability question</tspan><tspan x="400" dy="25">Exclude below 0.5 in this experiment</tspan></text><rect x="740" y="250" width="310" height="130" rx="8" fill="#e9effb" stroke="#c6d3c7"/><text x="760" y="281" class="label"><tspan x="760" dy="0">Combine and execute</tspan></text><text x="760" y="312" class="small"><tspan x="760" dy="0">Keep the highest-valued approved round</tspan><tspan x="760" dy="25">Follow paths and collect actual wood</tspan><tspan x="760" dy="25">Reserve final return and delivery</tspan></text><path class="line" d="M690,302 L730,302"/><path class="line" d="M690,442 L716,442"/><path class="line" d="M716,442 L748,380"/><path class="line" d="M895,380 L895,535 L185,535 L185,250"/><text x="35" y="584" class="label"><tspan x="35" dy="0">All offered rounds already pass deterministic feasibility checks.</tspan></text><text x="35" y="617" class="small"><tspan x="35" dy="0">The extra model gate can reject safe rounds. Raw probabilities, choices and tool traces are recorded.</tspan></text></svg>