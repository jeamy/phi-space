# nginx on big for spaces-files (spaces-files/docs/operator-guide.en.md, section 11), as for codemode and spaces-mmo:
# /etc/nginx/sites-available/spaces-files.eibrain.org, linked into sites-enabled. The certificate comes from certbot
# (webroot /var/www/acme). The service listens on 127.0.0.1:4200 with plain HTTP and checks Origin against
# https://spaces-files.eibrain.org: Host and Origin pass unchanged. Uploads are JSON with base64 contents, so the body
# bound is the service's maxFileBytes in base64 plus room (16 MiB files: about 22 MiB; the service refuses beyond its own bound).
server {
    listen 80;
    listen [::]:80;
    server_name spaces-files.eibrain.org;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    include /etc/nginx/snippets/cms-probe-block.conf;

    listen 443 ssl;
    listen [::]:443 ssl;
    listen [2a0a:4cc0:c0:62f2:8000::1003]:443 ssl;
    server_name spaces-files.eibrain.org;

    ssl_certificate /etc/letsencrypt/live/spaces-files.eibrain.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/spaces-files.eibrain.org/privkey.pem;

    access_log /var/log/nginx/spaces-files.eibrain.org.log;
    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:4200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
